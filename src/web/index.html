<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRE Incident Triage Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- HTMX JSON Enc extension to post form data as JSON -->
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/json-enc.js"></script>
    <style>
        /* HTMX only adds .htmx-request while a request is in flight. */
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in-out; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased" hx-ext="json-enc">

    <!-- Top Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="text-xl font-bold tracking-wide text-white">Incident Triage Engine</h1>
        </div>
        <div class="flex items-center space-x-4 text-xs text-slate-400">
            <span>Target: <code class="text-sky-400">/api/v1/triage</code></span>
            <span class="inline-block w-px h-4 bg-slate-800"></span>
            <!-- Version comes from src/config.py Settings.VERSION -->
            <span class="bg-slate-800 text-slate-300 px-2 py-1 rounded border border-slate-700">v{{VERSION}}</span>
        </div>
    </header>

    <!-- Main Dashboard Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 overflow-hidden">

        <!-- Left Column: Log Input Controls (5 cols) -->
        <section class="lg:col-span-5 flex flex-col bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Raw Telemetry Ingestion</h2>
                <button type="button"
                    onclick="loadSampleLogs()"
                    class="text-xs text-sky-400 hover:text-sky-300 uppercase transition-colors">
                + Load Sample Error Burst
                </button>
            </div>

            <form hx-post="/api/v1/triage"
                  hx-ext="json-enc"
                  hx-target="#triage-results"
                  hx-indicator="#loading-spinner"
                  class="flex-1 flex flex-col space-y-4">
                
                <div class="flex-1 flex flex-col">
                    <label for="raw_logs" class="sr-only">Raw Log Payload</label>
                    <textarea id="raw_logs"
                              name="raw_logs"
                              required
                              minlength="10"
                              placeholder="Place unstructured log lines here..."
                              class="w-full flex-1 min-h-[350px] p-4 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent resize-none leading-relaxed"></textarea>
                </div>              
            
                <div class="flex items-center space-x-3 pt-2">
                    <!-- Serving menu: rendered by /api/v1/mode so the markup lives in one place.
                         hx-target="this" is required: HTMX inherits hx-target from the enclosing
                         form, which would swap the menu fragment into #triage-results. -->
                    <div id="mode-control" class="shrink-0"
                         hx-get="/api/v1/mode"
                         hx-trigger="load"
                         hx-target="this"
                         hx-swap="outerHTML"></div>
                    <button type="submit"
                            class="flex-1 bg-sky-600 hover:bg-sky-500 text-white font-medium text-sm py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2 shadow-lg shadow-sky-600/20">
                        <span>Analyze & Triage Payload</span>
                    </button>
                    <button type="button"
                            onclick="document.getElementById('raw_logs').value=''"
                            class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm transition-colors">
                    Clear
                    </button>
                </div>
            </form>
        </section>

        <!-- Right Column: Incident Analysis Dashboard (7 Cols) -->
        <section class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-2xl flex flex-col overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Triage Analysis & Metrics</h2>

                <!-- HTMX Loading Indicator -->
                <div id="loading-spinner" class="htmx-indicator flex items-center space-x-2 text-sky-400 text-xs">
                    <svg class="animate-spin h-4 w-4 text-sky-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Processing logs with LLM...</span>
                </div>
            </div>

            <!-- Stored-report notice: rendered by /api/v1/reports/summary so the chip and
                 the recent list live in one place. Filled on page load and refreshed after
                 an analysis, never polled. -->
            <div id="storage-status"
                 hx-get="/api/v1/reports/summary"
                 hx-trigger="load, storage-refresh"
                 hx-target="this"
                 hx-swap="outerHTML"></div>

            <!-- Dynamic Results Target Area -->
            <div id="triage-results" class="flex-1 flex flex-col justify-center items-center text-center p-8 border-2 border-dashed border-slate-800 rounded-lg bg-slate-950/50">
                <svg class="w-12 h-12 text-slate-700 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <p class="text-slate-400 text-sm font-medium">No Triage Report Generated</p>
                <p class="text-slate-600 text-sm mt-1 max-w-sm">Paste raw telemetry logs into the left pane and submit to run the ingestion pipeline.</p>
            </div>
        </section>

    </main>

    <!-- Helper JS for loading sample telemetry logs.
        parse_log_line accepts two shapes: the pinned line
        "2026-09-01 12:00:00 [INFO] 200 45ms - GET /api/v1/health" and the key-value
        variant `2026-09-22T21:14:02.102Z [ERROR] status=500 latency=482ms msg="..."`.
        The pattern is anchored at the start of the line, so a sample line that arrives
        with leading spaces is counted as unparseable rather than trimmed.
    -->
    <script>
        function toggleModeMenu() {
            document.getElementById('mode-menu')?.classList.toggle('hidden');
        }

        // Close the Serving menu when clicking anywhere outside it, including after an
        // HTMX swap replaces the control with a freshly rendered fragment.
        document.addEventListener('click', (event) => {
            const control = document.getElementById('mode-control');
            const menu = document.getElementById('mode-menu');
            if (control && menu && !control.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });

        // Route response errors by target: htmx:responseError bubbles, so a failed mode
        // switch must not overwrite the report area. The Serving control is replaced on
        // every swap, which drops inline handlers, so the listener lives on document.
        document.addEventListener('htmx:responseError', (event) => {
            const target = event.detail && event.detail.target;
            if (target && target.id === 'triage-results') {
                showRequestError(event);
                return;
            }
            showModeError(event);
        });

        // An analysis either stores a row or names why it did not, so the notice is
        // refreshed once per triage rather than on a timer.
        document.addEventListener('htmx:afterRequest', (event) => {
            const target = event.detail && event.detail.target;
            if (target && target.id === 'triage-results') {
                document.getElementById('storage-status')?.dispatchEvent(
                    new CustomEvent('storage-refresh')
                );
            }
        });

        function showModeError(event) {
            const menu = document.getElementById('mode-menu');
            if (!menu) return;
            let detail = event.detail.xhr && event.detail.xhr.responseText;
            try {
                const body = JSON.parse(detail);
                if (body.detail) detail = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail);
            } catch (e) { /* keep raw text */ }
            menu.classList.remove('hidden');
            const note = document.createElement('p');
            note.className = 'text-[10px] text-rose-300 px-2 pt-1 break-all';
            note.textContent = detail || 'Backend switch failed.';
            menu.appendChild(note);
        }

        function showRequestError(event) {
            const xhr = event.detail.xhr;
            let detail = xhr.responseText || 'The triage request failed.';
            try {
                const body = JSON.parse(xhr.responseText);
                if (body.detail) detail = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail);
            } catch (e) { /* keep raw text */ }

            document.getElementById('triage-results').innerHTML =
                '<div class="p-4 rounded-lg border border-rose-700/50 bg-rose-900/30 text-sm text-rose-200">'
                + '<span class="font-semibold uppercase text-xs tracking-wider">Request failed (' + xhr.status + ')</span>'
                + '<p class="mt-2 font-mono text-xs break-all">' + detail + '</p></div>';
        }

        function loadSampleLogs() {
            // One string per line, joined afterwards. A template literal indented to line
            // up with the source would hand the textarea leading spaces, and the parser
            // anchors at the start of the line: only the first line ever parsed.
            const sampleLogs = [
                '2026-09-22T21:14:02.102Z [ERROR] status=500 latency=482ms msg="Database Connection Timeout on pool acquisition"',
                '2026-09-22T21:14:02.115Z [ERROR] status=503 latency=120ms msg="Redis cluster unreachable host=10.0.4.12"',
                '2026-09-22T21:14:02.150Z [WARN]  status=429 latency=15ms  msg="Rate limiter triggered user_id=89231"',
                '2026-09-22T21:14:02.210Z [ERROR] status=500 latency=850ms msg="Failed to render template user_dashboard"',
                '2026-09-22T21:14:02.301Z [INFO]  status=200 latency=42ms  msg="GET /api/v1/health operational"',
            ].join('\n');

            document.getElementById('raw_logs').value = sampleLogs;
        }
    </script>
</body>
</html>
