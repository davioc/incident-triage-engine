# Shared lint settings. black formats at 88 characters, so flake8 must agree with it
# rather than reporting its own 79-character default against every wrapped line.
[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .venv, __pycache__, .chroma_db

# Long docstrings, LLM prompt strings and the inline HTML template cannot be wrapped by
# black; they are pre-existing and tracked separately from the lint gate.
per-file-ignores =
    src/api/routes.py: E501
    src/llm_client.py: E501
    src/schema.py: E501
