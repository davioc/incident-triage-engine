# Docker Compose stack for the Incident Triage Engine.
#   docker compose up          -> dashboard + API on http://localhost:8000
#   docker compose --profile llm up   -> also runs an Ollama container for the stack
#
# TRIAGE_MODE is read by src/config.py; it defaults to mock, so the stack runs
# offline with no keys and no LLM container. With TRIAGE_MODE=ollama the app targets the
# host's Ollama by default, since its volume is empty until a model is pulled into it.

services:
  app:
    build: .
    image: incident-triage-engine
    # A stable hostname so /api/v1/health reads as this service instead of a container
    # id, which is how you tell the stack apart from a host dev server (issue #10).
    hostname: incident-triage-engine-app
    ports:
      - "8000:8000"
    environment:
      TRIAGE_MODE: ${TRIAGE_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      # Default target is the host's Ollama, which already holds the pulled models.
      # With --profile llm, set OLLAMA_BASE_URL=http://ollama:11434/v1 to use the
      # in-stack service instead, and pull the model into that container first.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # The index lives on a named volume, not inside the image.
      CHROMA_DB_DIR: /app/.chroma_db
      # Report storage. Empty means disabled; the stack below sets a real URL.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://triage:triage@postgres:5432/triage}
    # Docker Desktop resolves host.docker.internal itself; host-gateway makes the same
    # name work on a plain Docker Engine on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist the runbook index so ingest survives restarts. The app user owns it;
      # without this the non-root container cannot write into its own home directory.
      - chroma_db:/app/.chroma_db
    # The reports table is migrated at container start, so the database must be
    # reachable before the service accepts requests.
    depends_on:
      postgres:
        condition: service_healthy
    # No depends_on for ollama: Compose rejects a dependency on a profile-gated
    # service, and the engine already degrades to heuristics when no LLM answers.
    profiles: [""]

  # Local development credentials. Override POSTGRES_PASSWORD for anything real;
  # these defaults exist so `docker compose up` works without extra configuration.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triage}
      POSTGRES_DB: ${POSTGRES_DB:-triage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triage} -d ${POSTGRES_DB:-triage}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Only started with --profile llm. Its model volume starts empty, so pull the model
  # into it (docker exec <ollama container> ollama pull llama3.2) and point the app at
  # this service with OLLAMA_BASE_URL=http://ollama:11434/v1.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    profiles: ["llm"]

volumes:
  chroma_db:
  ollama_models:
  postgres_data:
