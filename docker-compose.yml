# Docker Compose stack for the Incident Triage Engine.
#   docker compose up          -> dashboard + API on http://localhost:8000
#   docker compose --profile llm up   -> also runs Ollama (Llama 3.2) locally
#
# TRIAGE_MODE is read by src/config.py; it defaults to mock, so the stack runs
# offline with no keys and no LLM container.

services:
  app:
    build: .
    image: incident-triage-engine
    ports:
      - "8000:8000"
    environment:
      TRIAGE_MODE: ${TRIAGE_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # The index lives on a named volume, not inside the image.
      CHROMA_DB_DIR: /app/.chroma_db
    volumes:
      # Persist the runbook index so ingest survives restarts. The app user owns it;
      # without this the non-root container cannot write into its own home directory.
      - chroma_db:/app/.chroma_db
    # No depends_on for ollama: Compose rejects a dependency on a profile-gated
    # service, and the engine already degrades to heuristics when no LLM answers.
    profiles: [""]

  # Only started with --profile llm, or when TRIAGE_MODE=ollama pulls it in via
  # depends_on. Set TRIAGE_MODE=ollama in .env to use it.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    profiles: ["llm"]

volumes:
  chroma_db:
  ollama_models:
