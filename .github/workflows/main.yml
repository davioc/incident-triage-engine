name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8, settings in setup.cfg)
        run: python -m flake8 src tests scripts alembic run_triage.py

      - name: Formatting (black, 88-character limit)
        run: python -m black --check src tests scripts alembic run_triage.py

      - name: Test suite (LLM calls and runbook retrieval are mocked)
        run: python -m pytest -q

      # Reported, not gated: the coverage number is a target for Week 9, not a rule yet.
      - name: Coverage report
        run: python -m pytest -q --cov=src --cov-report=term-missing
